# TrustBuy AI CI - lint, type-check, test, build every service on every
# push/PR (docs/TESTING_STRATEGY.md §7 "CI/CD gates"). GitHub only ever
# looks in .github/workflows/ - infra/github-actions/README.md points here
# so the physical layout still matches ARCHITECTURE.md §7 in spirit.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check libs services

  backend-tests:
    needs: python-lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ${{ matrix.service }} (dev)
        working-directory: services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          # requirements*.txt reference ../../libs/* by absolute-in-container
          # path in Docker; locally we install the libs editable directly.
          pip install -e ../../libs/trustbuy_common
          if [ -d ../../libs/trustbuy_db ] && grep -q trustbuy_db requirements.txt; then pip install -e ../../libs/trustbuy_db; fi
          if [ -d ../../libs/trustbuy_auth ] && grep -q trustbuy_auth requirements.txt; then pip install -e ../../libs/trustbuy_auth; fi
          pip install -r requirements-dev.txt --no-deps || pip install -r requirements-dev.txt
      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build

  docker-build:
    needs: [backend-tests, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build every service image (no push - build-only CI gate)
        run: |
          docker compose --env-file .env.example -f infra/docker/docker-compose.yml build
