[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustbuy-db"
version = "0.1.0"
description = "TrustBuy AI - shared SQLAlchemy models and Alembic migrations"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "asyncpg>=0.29,<1",
    "psycopg2-binary>=2.9,<3",
    "alembic>=1.13,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["trustbuy_db*"]
