[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustbuy-common"
version = "0.1.0"
description = "TrustBuy AI - shared base models, error types, logging, config helpers"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "fastapi>=0.111,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["trustbuy_common*"]
